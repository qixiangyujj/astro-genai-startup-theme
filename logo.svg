<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Polyhedrontech logo">
  <!-- Dark background -->
  <rect width="100" height="100" rx="14" fill="#0b0b0f"/>

  <!-- 6 colored facets, hexagonal pinwheel -->
  <g stroke="#0e3a6b" stroke-width="1.2" stroke-linejoin="round">
    <polygon points="50,50 50,15 80.31,32.5" fill="#F5C842"/>     <!-- yellow -->
    <polygon points="50,50 80.31,32.5 80.31,67.5" fill="#19BFA8"/> <!-- teal -->
    <polygon points="50,50 80.31,67.5 50,85" fill="#F25C3B"/>      <!-- orange-red -->
    <polygon points="50,50 50,85 19.69,67.5" fill="#2079D6"/>      <!-- blue -->
    <polygon points="50,50 19.69,67.5 19.69,32.5" fill="#3CC56C"/> <!-- green -->
    <polygon points="50,50 19.69,32.5 50,15" fill="#E83C50"/>      <!-- red -->
  </g>

  <!-- Inner star-of-david accent (stellation suggestion) -->
  <g fill="rgba(255,255,255,0.08)" stroke="#0e3a6b" stroke-width="1" stroke-linejoin="round">
    <polygon points="50,28 67.32,58 32.68,58"/>
    <polygon points="50,72 67.32,42 32.68,42"/>
  </g>

  <!-- Outer hex outline -->
  <polygon points="50,15 80.31,32.5 80.31,67.5 50,85 19.69,67.5 19.69,32.5"
           fill="none" stroke="#0e3a6b" stroke-width="1.6"/>

  <!-- Highlight glints -->
  <polygon points="50,15 56,28 50,32 44,28" fill="rgba(255,255,255,0.18)"/>
  <polygon points="80.31,32.5 70,40 76,46" fill="rgba(255,255,255,0.10)"/>
</svg>
